<title>퐁당다이빙</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script>
/* ===== 퐁당 Supabase 연결: 실시간 멀티플레이 + 기록 저장 + 닉네임 영구 중복 방지 + 운영자 확인 ===== */
window.PD_SITE=1;window.PD_TAKEN=new Set();
(function(){
const ORIG=window.claude;let netMode='init',netErr='';   // 아티팩트 환경이 주는 기본 기능 (Supabase가 안 되면 대신 써요)
const fb=n=>{try{return ORIG&&ORIG.use?ORIG.use(n):Promise.resolve(null)}catch(e){return Promise.resolve(null)}};
const LS=k=>{try{return localStorage.getItem(k)}catch(e){return null}},SV=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let tok=LS('pd_token');
if(!/^[A-Z2-9]{16}$/.test(tok||'')){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(16));tok='';for(const x of r)tok+=a[x%a.length];SV('pd_token',tok)}
try{const q=new URLSearchParams(location.search).get('admin');if(q){SV('pd_admin',q);history.replaceState(null,'',location.pathname)}}catch(e){}
window.PD_CODE=()=>tok.replace(/(.{4})(?=.)/g,'$1-');
const SUPABASE_URL='https://titmnoayqbgzjupfgxcw.supabase.co';
const SUPABASE_KEY='sb_publishable_kQKgfgGUMlZcDbnkXTCEhw_kHM5DKRE';

/* ---- Supabase 클라이언트 / DB 함수 호출 ---- */
let sb=null;
function sbc(){if(sb)return sb;if(!window.supabase||!window.supabase.createClient)return null;sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);return sb}
async function rpc(fn,args){const c=sbc();if(!c)throw new Error('Supabase 라이브러리를 불러오지 못했어요');const r=await c.rpc(fn,args);if(r.error)throw r.error;return r.data}
window.PD_HAS=async code=>!!(await rpc('pd_has',{p_token:code}));

/* ---- 계정(기록 저장 · 닉네임 · 운영자) ---- */
let owner=false,saveRow=null,acctP=null;const claimed=new Set(),badNames=new Set();
function setTaken(list){PD_TAKEN.clear();(list||[]).forEach(x=>PD_TAKEN.add(String(x)))}
function initAcct(){
 if(acctP)return acctP;
 acctP=(async()=>{
  saveRow=await rpc('pd_load',{p_token:tok});               // 함수가 없으면(SQL 미실행) 여기서 오류 → 기록 저장은 기기 안에만
  owner=!!(await rpc('pd_is_owner',{p_token:tok,p_admin:LS('pd_admin')||''}).catch(()=>false));
  setTaken(await rpc('pd_taken_names',{p_token:tok}).catch(()=>[]));
  setInterval(()=>{rpc('pd_taken_names',{p_token:tok}).then(setTaken).catch(()=>{})},20000);
  return true;
 })().catch(e=>{console.error('[퐁당 계정]',e);acctP=null;throw e});
 return acctP;
}
const userApi={id:async()=>tok,isOwner:()=>owner,canEdit:()=>owner};
const dbApi={doc:()=>({
 get:async()=>saveRow?{exists:true,data:()=>saveRow}:{exists:false,data:()=>undefined},
 set:async d=>{await rpc('pd_save',{p_token:tok,p_save:d.j});saveRow={j:d.j,t:Date.now()}}
})};
function claimName(n){
 n=String(n||'').trim().slice(0,10);const l=n.toLowerCase();
 if(!n||l==='다이버'||claimed.has(l)||badNames.has(l))return;
 claimed.add(l);
 initAcct().then(()=>rpc('pd_claim_name',{p_token:tok,p_name:n})).then(ok=>{if(!ok){badNames.add(l);claimed.delete(l);rpc('pd_taken_names',{p_token:tok}).then(setTaken).catch(()=>{})}}).catch(()=>{claimed.delete(l)});
}

/* ---- 실시간 멀티플레이 ---- */
const sid=tok+'-'+Math.random().toString(36).slice(2,7);   // 같은 계정으로 여러 기기/탭이 들어와도 서로 따로 보이도록 접속마다 다른 번호를 써요
let channel=null,ready=false,mine=null;
const peerMap=new Map(),online=new Set(),subs=new Map();
let initPromise=null;
const outOf=o=>(o&&o.n&&badNames.has(String(o.n).trim().toLowerCase()))?Object.assign({},o,{n:'다이버'}):o;   // 이미 남이 쓰는 이름은 내보내지 않아요
const sendPlayer=()=>{if(ready&&channel&&mine&&mine.x!==undefined)channel.send({type:'broadcast',event:'player',payload:{id:sid,presence:outOf(mine)}}).catch(()=>{})};
function initRoom(){
 if(initPromise)return initPromise;
 initPromise=(async()=>{
  const c=sbc();if(!c)throw new Error('Supabase 라이브러리를 불러오지 못했어요');
  channel=c.channel('pongdang-main-room',{config:{broadcast:{self:false},presence:{key:sid}}});
  channel.on('broadcast',{event:'player'},({payload})=>{
   if(!payload||!payload.id||payload.id===sid||!payload.presence)return;
   peerMap.set(payload.id,payload.presence);
  });
  channel.on('broadcast',{event:'emote'},({payload})=>{
   if(!payload||!payload.id||payload.id===sid)return;
   const old=peerMap.get(payload.id)||{};
   peerMap.set(payload.id,Object.assign({},old,{em:payload.em,et:payload.et}));
  });
  channel.on('broadcast',{event:'msg'},({payload})=>{
   if(!payload||!payload.id||payload.id===sid||!payload.topic)return;
   (subs.get(String(payload.topic))||[]).forEach(fn=>{try{fn(payload.data)}catch(e){}});
  });
  channel.on('presence',{event:'join'},()=>{sendPlayer()});   // 새로 들어온 사람에게 내 위치를 바로 알려요
  channel.on('presence',{event:'sync'},()=>{
   const st=channel.presenceState();
   online.clear();Object.keys(st||{}).forEach(k=>online.add(k));
   peerMap.forEach((v,k)=>{if(!online.has(k))peerMap.delete(k)});
  });
  await new Promise((resolve,reject)=>{
   let settled=false;
   const timer=setTimeout(()=>{if(!settled){settled=true;reject(new Error('Supabase 연결 시간이 초과됐어요'))}},12000);
   channel.subscribe(async status=>{
    if(status==='SUBSCRIBED'&&!settled){
     try{await channel.track({id:sid,connected_at:new Date().toISOString()});ready=true;settled=true;clearTimeout(timer);resolve(true)}
     catch(e){settled=true;clearTimeout(timer);reject(e)}
    }else if((status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED')&&!settled){settled=true;clearTimeout(timer);reject(new Error('실시간 채널 연결 실패: '+status))}
   });
  });
  setInterval(sendPlayer,2500);   // 가만히 서 있는 사람도 새로 온 사람에게 보이도록 주기적으로 다시 알려요
  return true;
 })().catch(e=>{console.error('[퐁당 멀티플레이]',e);ready=false;initPromise=null;throw e});
 return initPromise;
}
/* 위치 전송은 초당 약 6번으로 줄여요 (Supabase 무료 한도 보호). 이모지는 바로 보내요. */
let pend=null,lastSend=0,timer=null;
function flush(){timer=null;if(!pend||!ready||!channel)return;lastSend=Date.now();const o=pend;pend=null;channel.send({type:'broadcast',event:'player',payload:{id:sid,presence:o}}).catch(()=>{})}
const room={
 emit:async(topic,data)=>{if(ready&&channel)await channel.send({type:'broadcast',event:'msg',payload:{id:sid,topic:String(topic).slice(0,20),data}})},
 on:(topic,fn)=>{const a=subs.get(topic)||[];a.push(fn);subs.set(topic,a);return()=>{const b=subs.get(topic)||[];const i=b.indexOf(fn);if(i>=0)b.splice(i,1)}},
 peers:()=>[{peer:sid,isMe:true,kind:'viewer',presence:mine}].concat(Array.from(peerMap.entries()).filter(([id])=>online.has(id)).map(([id,p])=>({peer:id,isMe:false,kind:'viewer',presence:p}))),
 presence:async o=>{
  if(o&&o.em&&o.et&&o.x===undefined){      // 이모지: 내 위치 정보는 덮어쓰지 않아요
   if(ready&&channel)await channel.send({type:'broadcast',event:'emote',payload:{id:sid,em:o.em,et:o.et}});
   return;
  }
  mine=o;
  if(o&&o.n)claimName(o.n);
  if(!ready||!channel)return;
  pend=outOf(o);
  const w=160-(Date.now()-lastSend);
  if(w<=0)flush();else if(!timer)timer=setTimeout(flush,w);
 }
};

/* ---- 화면 왼쪽 위 작은 상태 표시 (멀티플레이가 되는지 한눈에 확인) ---- */
setInterval(()=>{try{
 let el=document.getElementById('pdNet');
 if(!el){if(!document.body)return;el=document.createElement('div');el.id='pdNet';el.style.cssText='position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:50;font:600 12px/1.3 sans-serif;color:#17324d;background:rgba(255,255,255,.82);border-radius:10px;padding:4px 9px;pointer-events:none;max-width:70vw';document.body.appendChild(el)}
 let t='';
 if(netMode==='fail')t='🔴 멀티플레이 안 됨: '+netErr;
 if(t)t+=' · v338';
 if(el.textContent!==t)el.textContent=t;
 el.style.display=t?'':'none';
}catch(e){}},1500);
window.claude={use:async n=>{
 if(n==='room'){
  try{const p=await initRoom();netMode='sb';initAcct().catch(()=>{});return room}
  catch(e){netErr=(e&&e.message)||String(e);netMode=ORIG?'fb':'fail';return fb('room')}
 }
 if(n==='user'||n==='db'){
  try{await Promise.race([initAcct(),new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),8000))]);return n==='user'?userApi:dbApi}
  catch(e){return fb(n)}
 }
 return fb(n);
}};
})();

</script>
